[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anonimizador"
version = "0.2.0"
description = "Anonimización local de documentos Word y PDF para bufetes"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.2",
    "PySide6-Essentials>=6.6",
    "PyMuPDF>=1.24.2",
    "rapidocr>=3.4",
    "onnxruntime>=1.18",
    "tokenizers>=0.15",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]

[project.scripts]
anonimizador = "anonimizador.__main__:main"

[project.gui-scripts]
anonimitzador = "anonimizador.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Los lentos (documentos largos) no se ejecutan siempre: `pytest -m slow` para lanzarlos.
addopts = "-m 'not slow'"
markers = ["slow: documentos largos (minutos); se lanzan con -m slow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
